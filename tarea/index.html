<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Tarea: Registro de Rutina de Ejercicios</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Registro de Rutina de Ejercicios</h1>
    </header>

    <section>
      <h2>Agregar Ejercicio</h2>
      <form id="formEjercicio">
        <label for="ejNombre">Nombre del ejercicio:</label>
        <input
          id="ejNombre"
          type="text"
          placeholder="Ej. Press de banca"
          required
        /><br /><br />

        <label for="ejPeso">Peso (kg):</label>
        <input
          id="ejPeso"
          type="number"
          step="0.5"
          placeholder="Ej. 60"
          required
        /><br /><br />

        <label for="ejReps">Repeticiones:</label>
        <input
          id="ejReps"
          type="number"
          placeholder="Ej. 10"
          required
        /><br /><br />

        <button type="submit">Registrar Serie</button>
      </form>
      <p id="mensajeValidacion"></p>
    </section>

    <section>
      <h2>Series Registradas</h2>
      <ul id="listaEjercicios"></ul>
      <p>
        <strong>Volumen Total de la Sesión:</strong>
        <span id="volumenTotal">0</span> kg
      </p>
    </section>

    <script src="app.js"></script>
  </body>
</html>
